name: Sync Blog Posts to Substack

on:
  push:
    branches: [main]
    paths:
      - 'content/blog/**'
  workflow_dispatch:

concurrency:
  group: substack-sync-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write

env:
  SUBSTACK_URL: https://chiprarau.substack.com

jobs:
  sync:
    name: Sync to Substack
    runs-on: [self-hosted, chipmac]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # chips-mac is a shared machine: azure/login's cleanup runs against
      # AZURE_CONFIG_DIR, and if that is the default ~/.azure it logs Chip
      # out of his own session. Give every run its own config dir. This
      # must come before azure/login. (azure/login@v1 would clear the
      # shared dir in a PRE-step, before this could run: never use v1 here.)
      - name: Isolate Azure CLI config (per-run)
        run: |
          DIR="$RUNNER_TEMP/azure-$GITHUB_RUN_ID"
          mkdir -p "$DIR"
          echo "AZURE_CONFIG_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Log in to Azure via OIDC
        id: azlogin
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Fetch Substack cookie from Key Vault
        id: cookie
        run: |
          set +e
          SUBSTACK_COOKIE=$(az keyvault secret show \
            --vault-name ${{ vars.AZURE_KEYVAULT_NAME }} \
            --name substack-cookie \
            --query value -o tsv 2>/tmp/az-err)
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            if grep -qiE "Forbidden|does not have secrets get|AuthorizationFailed|403" /tmp/az-err; then
              echo "failure_reason=keyvault-permission" >> "$GITHUB_OUTPUT"
            else
              echo "failure_reason=keyvault" >> "$GITHUB_OUTPUT"
            fi
            echo "::error::Key Vault fetch failed:"
            cat /tmp/az-err
            exit 1
          fi
          echo "::add-mask::$SUBSTACK_COOKIE"
          echo "SUBSTACK_COOKIE=$SUBSTACK_COOKIE" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: pip3 install -r scripts/substack/requirements.txt

      - name: Run Substack sync
        id: sync
        run: |
          set +e
          python3 scripts/substack/sync.py 2>&1 | tee /tmp/sync.log
          RC=${PIPESTATUS[0]}
          set -e
          if [ $RC -ne 0 ]; then
            if grep -qiE "Just a moment|cloudflare|challenge" /tmp/sync.log; then
              echo "failure_reason=cloudflare" >> "$GITHUB_OUTPUT"
            elif grep -qiE "401|403|unauthoriz|forbidden" /tmp/sync.log; then
              echo "failure_reason=substack-cookie" >> "$GITHUB_OUTPUT"
            elif grep -qiE "Subtitle is too long" /tmp/sync.log; then
              echo "failure_reason=subtitle" >> "$GITHUB_OUTPUT"
            else
              echo "failure_reason=sync" >> "$GITHUB_OUTPUT"
            fi
            exit $RC
          fi

      - name: Commit updated sync state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scripts/substack/.substack-sync.json
          if git diff --cached --quiet; then
            echo "No changes to sync state file"
          else
            git commit -m "Update Substack sync state"
            git pull --rebase origin main
            git push
          fi

      - name: Notify Discord on failure
        if: failure()
        env:
          WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_CIPRIANRARAU_PRODUCTION }}
          REASON: ${{ steps.azlogin.outcome == 'failure' && 'oidc' || steps.cookie.outputs.failure_reason || steps.sync.outputs.failure_reason }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request

          reason = os.environ.get("REASON") or "unknown"
          cases = {
              "oidc": (
                  "Substack sync blocked: Azure OIDC login failed",
                  "The job could not get an Azure token from GitHub's OIDC "
                  "federation. Nothing on the Mac needs fixing.\n\n"
                  "**Check:** the `ciprianrarau-com-main` federated credential on "
                  "the `github-actions-ideaplaces` app registration (its subject "
                  "must match `repo:Ideaplaces/ciprianrarau.com:ref:refs/heads/"
                  "main`), and that the job still requests `id-token: write`.",
                  15105570),
              "keyvault-permission": (
                  "Substack sync blocked: no access to substack-cookie",
                  "Azure login worked, but reading the secret was denied.\n\n"
                  "**Check:** `github-actions-ideaplaces` still holds **Key Vault "
                  "Secrets User** on `kv-ideaplaces`.",
                  15105570),
              "keyvault": (
                  "Substack sync failed: Key Vault unreachable",
                  "`az keyvault secret show` failed after a successful login. "
                  "Check the run log for the Azure error.",
                  15158332),
              "substack-cookie": (
                  "Substack sync failed: the Substack cookie is rejected",
                  "Substack returned 401/403. The `substack.sid` cookie has most "
                  "likely expired.\n\n**Fix:** copy a fresh `substack.sid` from the "
                  "browser and run `az keyvault secret set --vault-name kv-ideaplaces "
                  "--name substack-cookie --value \"s%3A...\"`.",
                  15158332),
              "cloudflare": (
                  "Substack sync failed: blocked by Cloudflare",
                  "Substack served a challenge page instead of the API. The runner's "
                  "IP is being treated as non-residential. Check the Mac's network "
                  "(VPN on?), since a residential IP is the whole reason this job "
                  "runs on chips-mac.",
                  15158332),
              "subtitle": (
                  "Substack sync failed: an excerpt is too long",
                  "Substack rejects a `draft_subtitle` over **255 characters**, and "
                  "the sync maps a post's `excerpt` onto it. Shorten the excerpt in "
                  "the post's frontmatter.",
                  15844367),
          }
          title, desc, color = cases.get(reason, (
              "Substack sync failed",
              "The sync job failed. Check the run log for details.",
              15158332))

          commit = (os.environ.get("COMMIT_MSG") or "").splitlines()
          commit = commit[0] if commit else "(manual run)"
          desc += f"\n\n**Commit:** {commit}\n**By:** {os.environ.get('ACTOR','')}"

          payload = {"embeds": [{
              "title": f":x: {title}",
              "description": desc,
              "url": os.environ["RUN_URL"],
              "color": color,
              "footer": {"text": "ciprianrarau.com | substack-sync | runner chips-mac"},
          }]}
          req = urllib.request.Request(
              os.environ["WEBHOOK"],
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json",
                       # Discord 403s the default Python-urllib User-Agent.
                       "User-Agent": "ideaplaces-ci/1.0"})
          with urllib.request.urlopen(req) as r:
              print("discord:", r.status)
          PY
